<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레시피 생성</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:  #2ecc71; --green-d: #27ae60;
    --blue:   #3498db; --blue-d:  #2980b9;
    --red:    #e74c3c; --orange:  #f39c12;
    --gray:   #f5f6fa; --border:  #dfe6e9;
    --text:   #2d3436; --muted:   #636e72;
    --radius: 12px;    --shadow:  0 4px 20px rgba(0,0,0,.08);
  }

  body {
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    background: var(--gray); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
  }

  header {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center;
    gap: 12px; box-shadow: var(--shadow);
  }
  header .logo { font-size: 1.5rem; }
  header h1 { font-size: 1.1rem; font-weight: 700; }
  header p  { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  header a  { margin-left: auto; color: var(--blue); font-size: .85rem; text-decoration: none; }
  header a:hover { text-decoration: underline; }

  main { flex: 1; max-width: 960px; width: 100%; margin: 40px auto; padding: 0 20px 60px; }

  /* 스텝 바 */
  .steps-bar { display: flex; align-items: center; gap: 0; margin-bottom: 32px; }
  .step-item { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
  .step-item.active { color: var(--green); font-weight: 600; }
  .step-item.done   { color: var(--green-d); }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: .78rem; font-weight: 700; background: #fff; flex-shrink: 0;
  }
  .step-item.active .step-dot { border-color: var(--green); color: var(--green); }
  .step-item.done   .step-dot { border-color: var(--green-d); background: var(--green-d); color: #fff; }
  .step-line { flex: 1; height: 2px; background: var(--border); margin: 0 4px; }
  .step-line.done { background: var(--green-d); }

  /* 카드 */
  .card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 32px; }
  .card + .card { margin-top: 20px; }

  /* 재료 요약 */
  .ing-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0; }
  .ing-chip {
    background: #eaf8f0; color: var(--green-d);
    border: 1px solid #b2dfcc;
    border-radius: 20px; padding: 3px 10px; font-size: .8rem;
  }

  /* 옵션 폼 */
  .options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px; margin-top: 20px;
  }
  .opt-group label {
    display: block; font-size: .82rem;
    font-weight: 600; color: var(--muted);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em;
  }
  .opt-group select,
  .opt-group input[type=range] { width: 100%; }
  .opt-group select {
    padding: 9px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: .9rem; background: #fff;
  }
  .opt-group select:focus { outline: none; border-color: var(--green); }
  .slider-val { text-align: center; font-weight: 700; font-size: 1rem; margin-top: 4px; }

  /* 버튼 */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 11px 24px; border-radius: 8px; border: none;
    font-size: .92rem; font-weight: 600; cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn-green  { background: var(--green);  color: #fff; }
  .btn-green:hover:not(:disabled) { background: var(--green-d); }
  .btn-blue   { background: var(--blue);   color: #fff; }
  .btn-blue:hover:not(:disabled)  { background: var(--blue-d); }
  .btn-outline { background: #fff; border: 1.5px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--blue); color: var(--blue); }

  /* 로딩 */
  #loading-section { display: none; text-align: center; padding: 60px 0; }
  .spinner {
    width: 56px; height: 56px; border: 5px solid var(--border);
    border-top-color: var(--green); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-sub { color: var(--muted); font-size: .85rem; margin-top: 6px; }

  /* 오류 */
  #error-section { display: none; }
  .error-box {
    background: #fff5f5; border: 1.5px solid #ffd0d0;
    border-radius: 10px; padding: 20px 24px;
    display: flex; align-items: flex-start; gap: 14px;
  }
  .error-box .ei { font-size: 1.6rem; }
  .error-box .et { font-weight: 600; margin-bottom: 4px; }
  .error-box .em { color: var(--muted); font-size: .88rem; margin-bottom: 14px; }

  /* 결과 */
  #result-section { display: none; }
  .result-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .result-header h2 { font-size: 1.1rem; font-weight: 700; }
  .model-badge {
    font-size: .7rem; font-weight: 500;
    background: #e8f8ef; color: var(--green-d);
    padding: 2px 8px; border-radius: 20px;
  }
  .cache-badge {
    font-size: .7rem; background: #edf2ff; color: var(--blue-d);
    padding: 2px 8px; border-radius: 20px;
  }

  /* 레시피 카드 그리드 */
  .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

  .recipe-card {
    background: #fff; border: 1.5px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    transition: box-shadow .2s, transform .15s;
    cursor: pointer;
  }
  .recipe-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .recipe-card.expanded { cursor: default; transform: none; }

  .rc-header { padding: 20px 20px 0; }
  .rc-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge {
    font-size: .72rem; font-weight: 600; padding: 2px 8px;
    border-radius: 12px; border: 1px solid transparent;
  }
  .badge-easy   { background: #eafaf1; color: #1e8449; border-color: #a9dfbf; }
  .badge-medium { background: #fef9e7; color: #9a7d0a; border-color: #f9e79f; }
  .badge-hard   { background: #fdedec; color: #922b21; border-color: #f5b7b1; }
  .badge-time   { background: #eaf0fb; color: #1a5276; border-color: #aed6f1; }
  .badge-serve  { background: #f4ecf7; color: #6c3483; border-color: #d7bde2; }

  .rc-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
  .rc-desc  { font-size: .85rem; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }

  .rc-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px; border-top: 1px solid var(--border);
    font-size: .83rem; color: var(--blue);
    background: none; border-left: none; border-right: none; border-bottom: none;
    width: 100%; cursor: pointer; font-family: inherit;
  }
  .rc-toggle:hover { background: #f8fbff; }
  .toggle-icon { transition: transform .25s; }
  .expanded .toggle-icon { transform: rotate(180deg); }

  /* 상세 섹션 */
  .rc-detail { display: none; padding: 20px; border-top: 1px solid var(--border); background: #fafbfc; }
  .expanded .rc-detail { display: block; }

  .detail-section { margin-bottom: 20px; }
  .detail-section:last-child { margin-bottom: 0; }
  .detail-title {
    font-size: .78rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); margin-bottom: 10px;
  }

  /* 재료 목록 */
  .ing-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .ing-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
  .ing-table td:last-child { color: var(--muted); text-align: right; }
  .ing-table tr.has { }
  .ing-table tr.missing td:first-child { color: var(--red); font-weight: 600; }
  .ing-table tr.missing td:first-child::after { content: ' *'; }

  /* 조리 단계 */
  .steps-list { list-style: none; counter-reset: step; }
  .steps-list li {
    counter-increment: step; display: flex; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: .9rem; line-height: 1.5;
    align-items: flex-start;
  }
  .steps-list li:last-child { border-bottom: none; }
  .steps-list li::before {
    content: counter(step);
    min-width: 26px; height: 26px;
    background: var(--green); color: #fff;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: .78rem; font-weight: 700;
    flex-shrink: 0; margin-top: 1px;
  }

  /* 팁 */
  .tips-list { list-style: none; }
  .tips-list li { padding: 5px 0 5px 20px; position: relative; font-size: .88rem; color: var(--muted); }
  .tips-list li::before { content: '💡'; position: absolute; left: 0; }

  /* 없는 재료 */
  .missing-box {
    background: #fff8f0; border: 1px solid #f8c88a;
    border-radius: 8px; padding: 12px 14px; font-size: .88rem;
  }
  .missing-box .mi-title { font-weight: 600; color: var(--orange); margin-bottom: 8px; }
  .missing-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .missing-tag {
    background: #feede1; color: #c0392b; border: 1px solid #f5b7b1;
    border-radius: 14px; padding: 3px 10px; font-size: .82rem;
  }

  /* 저장 버튼 행 */
  .rc-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--border); }

  /* 결과 액션 바 */
  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

  /* 원문 폴백 */
  .raw-box {
    background: #f8f9fb; border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; font-size: .82rem;
    color: var(--muted); white-space: pre-wrap;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🍳</div>
  <div>
    <h1>레시피 생성</h1>
    <p>Step 2 — 재료 기반 맞춤 레시피 추천</p>
  </div>
  <a href="/" style="margin-left:auto;color:var(--blue);font-size:.85rem;text-decoration:none;white-space:nowrap">← Step 1</a>
  <div id="auth-nav" style="margin-left:12px"></div>
</header>
<script src="/static/auth.js"></script>

<main>

  <!-- 스텝 바 -->
  <div class="steps-bar">
    <div class="step-item done">
      <div class="step-dot">✓</div> 재료 인식
    </div>
    <div class="step-line done"></div>
    <div class="step-item active">
      <div class="step-dot">2</div> 레시피 생성
    </div>
    <div class="step-line"></div>
    <div class="step-item">
      <div class="step-dot">3</div> 저장
    </div>
  </div>

  <!-- 재료 요약 + 옵션 폼 -->
  <div class="card" id="options-card">
    <h2 style="font-size:1rem;font-weight:700;margin-bottom:12px">
      인식된 재료 <span id="ing-count" style="color:var(--muted);font-weight:400;font-size:.9rem"></span>
    </h2>
    <div class="ing-summary" id="ing-summary"></div>
    <a href="/" style="display:inline-block;margin-top:8px;font-size:.8rem;color:var(--blue)">재료 수정하기</a>

    <hr style="border:none;border-top:1px solid var(--border);margin:20px 0">

    <h2 style="font-size:1rem;font-weight:700;margin-bottom:4px">레시피 옵션</h2>
    <div class="options-grid">
      <div class="opt-group">
        <label>추천 수</label>
        <select id="opt-count">
          <option value="1">1개</option>
          <option value="2" selected>2개</option>
          <option value="3">3개</option>
        </select>
      </div>
      <div class="opt-group">
        <label>인원수 <span id="servings-val">2명</span></label>
        <input type="range" id="opt-servings" min="1" max="6" value="2"
               oninput="document.getElementById('servings-val').textContent=this.value+'명'">
      </div>
      <div class="opt-group">
        <label>최대 조리 시간</label>
        <select id="opt-time">
          <option value="15">15분</option>
          <option value="30" selected>30분</option>
          <option value="60">60분</option>
          <option value="">제한 없음</option>
        </select>
      </div>
      <div class="opt-group">
        <label>식이 제한</label>
        <select id="opt-dietary">
          <option value="none" selected>없음</option>
          <option value="vegetarian">채식</option>
          <option value="gluten-free">글루텐프리</option>
          <option value="dairy-free">유제품 제외</option>
        </select>
      </div>
      <div class="opt-group">
        <label>난이도</label>
        <select id="opt-difficulty">
          <option value="쉬움">쉬움</option>
          <option value="보통" selected>보통</option>
          <option value="어려움">어려움</option>
        </select>
      </div>
    </div>

    <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-green" id="generate-btn" onclick="generateRecipes()">
        🍽️ 레시피 생성하기
      </button>
    </div>
  </div>

  <!-- 로딩 -->
  <div class="card" id="loading-section">
    <div class="spinner"></div>
    <p style="color:var(--muted)">레시피를 생성하는 중...</p>
    <p class="loading-sub" id="loading-model"></p>
    <p class="loading-sub">보통 10~30초 소요됩니다</p>
  </div>

  <!-- 오류 -->
  <div id="error-section">
    <div class="error-box">
      <div class="ei">⚠️</div>
      <div>
        <div class="et" id="error-title">오류가 발생했습니다</div>
        <div class="em" id="error-msg"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-blue" id="retry-btn">🔄 다시 시도</button>
          <button class="btn btn-outline" onclick="showOptions()">← 옵션으로</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 결과 -->
  <div id="result-section">
    <div class="result-header">
      <h2>추천 레시피</h2>
      <span class="model-badge" id="model-badge"></span>
      <span class="cache-badge" id="cache-badge" style="display:none">캐시</span>
    </div>

    <!-- JSON 파싱 실패 시 원문 -->
    <div id="raw-section" style="display:none">
      <div class="card" style="margin-bottom:16px">
        <p style="color:var(--muted);font-size:.85rem;margin-bottom:10px">
          ⚠️ JSON 파싱에 실패했습니다. 모델 원문 응답입니다.
        </p>
        <div class="raw-box" id="raw-text"></div>
      </div>
    </div>

    <div class="recipe-grid" id="recipe-grid"></div>

    <div class="result-actions">
      <button class="btn btn-outline" onclick="showOptions()">← 옵션 변경</button>
      <button class="btn btn-green" onclick="generateRecipes()">🔄 다시 생성</button>
    </div>
  </div>

</main>

<script>
// ── 재료 로드 ──────────────────────────────────────────────
let ingredients = [];

function loadIngredients() {
  try {
    const raw = localStorage.getItem('step1_ingredients');
    ingredients = raw ? JSON.parse(raw) : [];
  } catch { ingredients = []; }

  const summary = document.getElementById('ing-summary');
  const count   = document.getElementById('ing-count');

  if (!ingredients.length) {
    summary.innerHTML = '<span style="color:var(--muted);font-size:.88rem">Step 1에서 전달된 재료가 없습니다. <a href="/">돌아가서 이미지를 업로드하세요.</a></span>';
    document.getElementById('generate-btn').disabled = true;
    count.textContent = '';
    return;
  }

  count.textContent = `(${ingredients.length}개)`;
  summary.innerHTML = ingredients.map(i =>
    `<span class="ing-chip">${i.name}${i.quantity ? ' · '+i.quantity : ''}</span>`
  ).join('');
}

// ── 섹션 전환 ────────────────────────────────────────────────
function showOptions()  {
  document.getElementById('options-card').style.display  = 'block';
  document.getElementById('loading-section').style.display = 'none';
  document.getElementById('error-section').style.display   = 'none';
  document.getElementById('result-section').style.display  = 'none';
}
function showLoading(modelHint) {
  document.getElementById('options-card').style.display    = 'none';
  document.getElementById('loading-section').style.display = 'block';
  document.getElementById('error-section').style.display   = 'none';
  document.getElementById('result-section').style.display  = 'none';
  document.getElementById('loading-model').textContent = modelHint || '';
}
function showError(title, msg) {
  document.getElementById('options-card').style.display    = 'none';
  document.getElementById('loading-section').style.display = 'none';
  document.getElementById('error-section').style.display   = 'block';
  document.getElementById('result-section').style.display  = 'none';
  document.getElementById('error-title').textContent = title;
  document.getElementById('error-msg').textContent   = msg;
}
function showResult() {
  document.getElementById('options-card').style.display    = 'none';
  document.getElementById('loading-section').style.display = 'none';
  document.getElementById('error-section').style.display   = 'none';
  document.getElementById('result-section').style.display  = 'block';
}

// ── 레시피 생성 ──────────────────────────────────────────────
async function generateRecipes() {
  if (!ingredients.length) return;

  const options = {
    count:      parseInt(document.getElementById('opt-count').value),
    servings:   parseInt(document.getElementById('opt-servings').value),
    max_time:   document.getElementById('opt-time').value,
    dietary:    document.getElementById('opt-dietary').value,
    difficulty: document.getElementById('opt-difficulty').value,
  };

  showLoading('사용 가능한 모델 탐색 중...');

  try {
    const res  = await fetch('/api/recipe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ingredients, options }),
    });
    const data = await res.json();

    if (!res.ok) {
      if (res.status === 429) {
        startRetryCountdown(data.retry_after || 60);
      } else {
        showError('레시피 생성 실패', data.message || '알 수 없는 오류');
        document.getElementById('retry-btn').onclick = generateRecipes;
      }
      return;
    }

    renderResult(data);

  } catch (err) {
    console.error('[generateRecipes error]', err);
    showError('네트워크 오류', `서버에 연결할 수 없습니다. (${err.message})`);
    document.getElementById('retry-btn').onclick = generateRecipes;
  }
}

function startRetryCountdown(sec) {
  let left = sec;
  const btn = document.getElementById('retry-btn');
  btn.onclick = generateRecipes;
  showError(
    'Rate Limit — 잠시 후 자동 재시도',
    `모든 모델이 일시적으로 사용량 한도에 도달했습니다. ${left}초 후 자동 재시도합니다.`
  );
  btn.disabled = true;
  const iv = setInterval(() => {
    left--;
    document.getElementById('error-msg').textContent =
      `모든 모델이 일시적으로 사용량 한도에 도달했습니다. ${left}초 후 자동 재시도합니다.`;
    if (left <= 0) {
      clearInterval(iv);
      btn.disabled = false;
      generateRecipes();
    }
  }, 1000);
}

// ── 결과 렌더링 ────────────────────────────────────────────
const ownedNames = () => new Set(ingredients.map(i => i.name));

function diffBadge(d) {
  const map = { '쉬움': 'badge-easy', '보통': 'badge-medium', '어려움': 'badge-hard' };
  return `<span class="badge ${map[d] || 'badge-medium'}">${d}</span>`;
}

function renderResult(data) {
  _allRecipes = data.recipes || [];
  _modelUsed  = data.model_used || '';

  document.getElementById('model-badge').textContent = data.model_used || '';
  const cacheBadge = document.getElementById('cache-badge');
  cacheBadge.style.display = data.from_cache ? 'inline-block' : 'none';

  // JSON 파싱 실패
  if (!data.recipes) {
    document.getElementById('raw-section').style.display = '';
    document.getElementById('raw-text').textContent = data.raw_text || '';
    document.getElementById('recipe-grid').innerHTML = '';
    showResult();
    return;
  }

  document.getElementById('raw-section').style.display = 'none';
  const grid = document.getElementById('recipe-grid');
  grid.innerHTML = '';

  data.recipes.forEach((r, idx) => {
    grid.appendChild(buildRecipeCard(r, idx));
  });

  showResult();
}

function buildRecipeCard(r, idx) {
  const owned = ownedNames();

  // 없는 재료
  const missing = (r.missing_ingredients || []).filter(Boolean);

  // 재료 행 HTML
  const ingRows = (r.ingredients || []).map(ing => {
    const hasMissing = missing.includes(ing.name) || !owned.has(ing.name);
    return `<tr class="${hasMissing ? 'missing' : 'has'}">
      <td>${ing.name}</td>
      <td>${ing.amount || ''}</td>
    </tr>`;
  }).join('');

  // 조리 단계
  const stepsHtml = (r.steps || []).map(s =>
    `<li>${s.replace(/^\d+\.\s*/, '')}</li>`
  ).join('');

  // 팁
  const tipsHtml = (r.tips || []).length
    ? `<ul class="tips-list">${r.tips.map(t => `<li>${t}</li>`).join('')}</ul>`
    : '<p style="color:var(--muted);font-size:.85rem">-</p>';

  // 없는 재료 박스
  const missingHtml = missing.length ? `
    <div class="missing-box">
      <div class="mi-title">⚠️ 없는 재료 (${missing.length}개)</div>
      <div class="missing-tags">
        ${missing.map(m => `<span class="missing-tag">${m}</span>`).join('')}
      </div>
      <button class="btn btn-outline" style="font-size:.8rem;padding:6px 14px"
              onclick="copyMissing(${idx})">📋 클립보드 복사</button>
    </div>` : '';

  const card = document.createElement('div');
  card.className = 'recipe-card';
  card.dataset.idx = idx;
  card.dataset.missing = JSON.stringify(missing);

  card.innerHTML = `
    <div class="rc-header">
      <div class="rc-badges">
        ${diffBadge(r.difficulty || '보통')}
        <span class="badge badge-time">⏱ ${r.cook_time || '?'}분</span>
        <span class="badge badge-serve">👥 ${r.servings || '?'}인분</span>
      </div>
      <div class="rc-title">${r.title || '레시피'}</div>
      <div class="rc-desc">${r.description || ''}</div>
    </div>

    <button class="rc-toggle" onclick="toggleCard(this)">
      <span>상세 조리법 보기</span>
      <span class="toggle-icon">▼</span>
    </button>

    <div class="rc-detail">
      <div class="detail-section">
        <div class="detail-title">📦 필요 재료</div>
        <table class="ing-table">
          <tbody>${ingRows}</tbody>
        </table>
        <p style="font-size:.75rem;color:var(--red);margin-top:6px">* 냉장고에 없는 재료</p>
      </div>

      ${missing.length ? `<div class="detail-section">${missingHtml}</div>` : ''}

      <div class="detail-section">
        <div class="detail-title">👨‍🍳 조리 방법</div>
        <ol class="steps-list">${stepsHtml}</ol>
      </div>

      <div class="detail-section">
        <div class="detail-title">💡 조리 팁</div>
        ${tipsHtml}
      </div>
    </div>

    <div class="rc-actions">
      <button class="btn btn-green" style="font-size:.85rem;padding:8px 18px"
              onclick="saveRecipe(${idx})" id="save-btn-${idx}">
        🔖 저장하기
      </button>
    </div>
  `;

  return card;
}

function toggleCard(btn) {
  const card = btn.closest('.recipe-card');
  const isExpanded = card.classList.toggle('expanded');
  btn.querySelector('span:first-child').textContent = isExpanded ? '접기' : '상세 조리법 보기';
}

function copyMissing(idx) {
  const card = document.querySelector(`.recipe-card[data-idx="${idx}"]`);
  const list = JSON.parse(card.dataset.missing || '[]').join(', ');
  navigator.clipboard.writeText(list)
    .then(() => alert('클립보드에 복사되었습니다:\n' + list))
    .catch(() => alert('복사 실패. 직접 선택해서 복사해 주세요.'));
}

// ── 저장 (Step 3 서버 연동) ───────────────────────────────
let _allRecipes  = [];
let _modelUsed   = '';

async function saveRecipe(idx) {
  const recipe = _allRecipes[idx];
  if (!recipe) return;

  Auth.requireAuth(async () => {
    const btn = document.getElementById(`save-btn-${idx}`);
    btn.disabled = true;
    btn.textContent = '저장 중...';

    const res  = await Auth.apiFetch('/api/recipes', {
      method: 'POST',
      body: JSON.stringify({ recipe, model_used: _modelUsed }),
    });
    const data = await res.json();

    if (res.status === 409) {
      btn.textContent = '✅ 이미 저장됨';
      return;
    }
    if (!res.ok) {
      btn.disabled = false;
      btn.textContent = '🔖 저장하기';
      alert(data.error || '저장 실패');
      return;
    }

    btn.textContent = '✅ 저장됨';
    btn.style.background = '#27ae60';
  });
}

// ── 프로필에서 기본 옵션 로드 ─────────────────────────────
async function loadProfileDefaults() {
  if (!Auth.isLoggedIn()) return;
  try {
    const res = await Auth.apiFetch('/api/profile');
    if (!res.ok) return;
    const p = await res.json();
    if (p.default_servings) {
      document.getElementById('opt-servings').value = p.default_servings;
      document.getElementById('servings-val').textContent = p.default_servings + '명';
    }
    if (p.dietary && p.dietary.length)
      document.getElementById('opt-dietary').value = p.dietary[0];
    if (p.skill_level) {
      const map = { '초보': '쉬움', '중급': '보통', '고급': '어려움' };
      document.getElementById('opt-difficulty').value = map[p.skill_level] || '보통';
    }
  } catch {}
}

// ── 초기화 ──────────────────────────────────────────────────
loadIngredients();
loadProfileDefaults();
showOptions();
</script>
</body>
</html>
